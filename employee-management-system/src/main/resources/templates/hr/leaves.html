<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Leave Requests')}"></head>
<body>
<div class="app">
<aside th:replace="~{fragments/layout :: hrSidebar('leaves')}"></aside>
<main class="content">
<header th:replace="~{fragments/layout :: topbar('Leave Requests')}"></header>
<div class="page">
<div th:replace="~{fragments/layout :: flash}"></div>
<ul class="nav nav-pills mb-3">
    <li class="nav-item"><a class="nav-link" th:classappend="${status == null} ? 'active'" th:href="@{/hr/leaves}">All</a></li>
    <li class="nav-item" th:each="s : ${statuses}">
        <a class="nav-link" th:classappend="${status == s} ? 'active'" th:href="@{/hr/leaves(status=${s})}" th:text="${s}"></a>
    </li>
</ul>
<div class="card">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Reason</th><th>Status</th><th style="min-width:260px">Decision</th></tr>
            </thead>
            <tbody>
            <tr th:each="l : ${leaves}">
                <td><strong th:text="${l.employee.fullName}"></strong><br><small class="text-muted" th:text="${'Applied ' + #temporals.format(l.appliedAt, 'dd MMM')}"></small></td>
                <td th:text="${l.leaveType.label}"></td>
                <td th:text="${#temporals.format(l.startDate,'dd MMM yyyy')} + ' - ' + ${#temporals.format(l.endDate,'dd MMM yyyy')}"></td>
                <td th:text="${l.days}"></td>
                <td th:text="${l.reason}"></td>
                <td><span class="badge" th:classappend="${l.status.badgeClass}" th:text="${l.status}"></span></td>
                <td>
                    <form th:if="${l.status.name() == 'PENDING'}" th:action="@{/hr/leaves/{id}/decision(id=${l.id})}" method="post" class="d-flex gap-1">
                        <input type="text" name="comment" class="form-control form-control-sm" placeholder="Comment (optional)" maxlength="500">
                        <button class="btn btn-sm btn-success" type="submit" name="decision" value="approve" title="Approve"><i class="bi bi-check-lg"></i></button>
                        <button class="btn btn-sm btn-danger" type="submit" name="decision" value="reject" title="Reject"><i class="bi bi-x-lg"></i></button>
                    </form>
                    <span th:unless="${l.status.name() == 'PENDING'}" class="small text-muted" th:text="${l.hrComment != null ? l.hrComment : '-'}"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(leaves)}"><td colspan="7" class="text-center text-muted py-4">No leave requests.</td></tr>
            </tbody>
        </table>
    </div>
    <div class="card-footer bg-white" th:if="${page.totalPages > 1}">
        <nav th:replace="~{fragments/layout :: pager(${page}, ${pagerUrl}, ${pagerExtra})}"></nav>
    </div>
</div>
</div>
</main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
