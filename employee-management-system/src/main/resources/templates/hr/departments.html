<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Departments')}"></head>
<body>
<div class="app">
<aside th:replace="~{fragments/layout :: hrSidebar('departments')}"></aside>
<main class="content">
<header th:replace="~{fragments/layout :: topbar('Departments')}"></header>
<div class="page">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="row g-4">
    <div class="col-lg-4">
        <div class="card">
            <div class="card-header" th:text="${departmentForm.id != null} ? 'Edit department' : 'Add department'">Department</div>
            <div class="card-body">
                <form th:action="@{/hr/departments}" th:object="${departmentForm}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                    </div>
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-outline-secondary" th:if="${departmentForm.id != null}" th:href="@{/hr/departments}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
    <div class="col-lg-8">
        <div class="card">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead class="table-light"><tr><th>Name</th><th>Description</th><th>Employees</th><th class="text-end">Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${rows}">
                        <td><strong th:text="${r.department().name}"></strong></td>
                        <td th:text="${r.department().description}"></td>
                        <td><span class="badge bg-primary" th:text="${r.employeeCount()}">0</span></td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/hr/departments(edit=${r.department().id})}"><i class="bi bi-pencil"></i></a>
                            <form class="d-inline" th:action="@{/hr/departments/{id}/delete(id=${r.department().id})}" method="post" data-confirm="Delete this department?">
                                <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}"><td colspan="4" class="text-center text-muted py-4">No departments yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</div>
</main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
