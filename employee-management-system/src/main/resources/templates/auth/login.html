<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<div class="auth-wrap">
    <div class="card auth-card shadow">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-people-fill text-primary" style="font-size: 2.5rem;"></i>
                <h4 class="mt-2 mb-0">Employee Management System</h4>
                <small class="text-muted">Sign in to continue</small>
            </div>
            <div class="alert alert-danger" th:if="${param.error}">Invalid username or password, or the account is inactive.</div>
            <div class="alert alert-info" th:if="${param.logout}">You have been signed out.</div>
            <div id="passkeyError" class="alert alert-danger d-none"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username webauthn">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>

            <div class="text-center text-muted my-3">or</div>
            <button type="button" id="passkeyLogin" class="btn btn-outline-success w-100">
                <i class="bi bi-fingerprint me-1"></i>Sign in with a passkey
            </button>
        </div>
    </div>
</div>
<script th:src="@{/js/webauthn.js}"></script>
<script>
    document.getElementById('passkeyLogin').addEventListener('click', async function () {
        var box = document.getElementById('passkeyError');
        box.classList.add('d-none');
        try {
            await window.loginWithPasskey();
        } catch (e) {
            box.textContent = e.message || 'Passkey sign-in was cancelled or failed. Use your password instead.';
            box.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
