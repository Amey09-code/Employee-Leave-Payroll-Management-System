<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<div class="error-wrap">
    <div>
        <div class="error-code">500</div>
        <h3 class="mb-2">Something went wrong</h3>
        <p class="text-muted mb-4" th:text="${message != null ? message : 'An unexpected error occurred. Please try again.'}">An unexpected error occurred. Please try again.</p>
        <a href="/" class="btn btn-primary">Back to home</a>
    </div>
</div>
</body>
</html>
