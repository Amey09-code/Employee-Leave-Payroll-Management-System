<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Page not found')}"></head>
<body>
<div class="error-wrap">
    <div>
        <div class="error-code">404</div>
        <h3 class="mb-2">Page not found</h3>
        <p class="text-muted mb-4" th:text="${message != null ? message : 'The page or record you are looking for does not exist.'}">The page or record you are looking for does not exist.</p>
        <a href="/" class="btn btn-primary">Back to home</a>
    </div>
</div>
</body>
</html>
