<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access denied')}"></head>
<body>
<div class="error-wrap">
    <div>
        <div class="error-code">403</div>
        <h3 class="mb-2">Access denied</h3>
        <p class="text-muted mb-4" th:text="${message != null ? message : 'You do not have permission to view this page.'}">You do not have permission to view this page.</p>
        <a href="/" class="btn btn-primary">Back to home</a>
    </div>
</div>
</body>
</html>
