spring.application.name=employee-management-system
server.port=8080

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Seed data (data.sql runs after Hibernate has created the tables; it is idempotent) ----
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Sessions ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---- WebAuthn / Passkeys ----
# rp-id must be the site's domain (no scheme, no port); allowed-origins must match the URL in the browser exactly.
# Passkeys only work on https:// or on http://localhost.
app.webauthn.rp-id=localhost
app.webauthn.rp-name=Employee Management System
app.webauthn.allowed-origins=http://localhost:8080
